# Installs every package into a fresh pi on Linux, macOS and Windows (scripts/smoke.mjs).
name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @earendil-works/pi-coding-agent
      - run: node scripts/smoke.mjs
